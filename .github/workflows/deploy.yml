# Pushes the app to its Hugging Face Space, which builds the root Dockerfile.
# Needs repo secret HF_TOKEN (write token) and repo variable HF_SPACE (e.g. "user/optichallenge").
name: Deploy to Hugging Face

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Space contents
        run: |
          mkdir space
          cp -r Dockerfile .dockerignore backend frontend space/
          rm -f space/backend/*.db space/backend/temp.*
          cat > space/README.md <<'EOF'
          ---
          title: OptiChallenge Water Game
          emoji: 💧
          colorFrom: blue
          colorTo: green
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          Deployed from GitHub. Edit the source there, not here.
          EOF

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
