# Backup pinger. Render's free tier sleeps after 15 minutes without traffic; the
# main pinger is an external cron (cron-job.org, every 10 min). GitHub often runs
# schedules late, so this only covers gaps if that one stops.
# Needs repo variable APP_URL (e.g. "https://optichallenge.onrender.com").
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl -fsS --retry 5 --retry-delay 30 --max-time 120 "${APP_URL}/api/health"
