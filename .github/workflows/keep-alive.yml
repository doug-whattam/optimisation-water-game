# Free Hugging Face Spaces pause after 48 hours without traffic. Ping the health
# endpoint every few hours so the game stays awake between events.
# Needs repo variable APP_URL (e.g. "https://user-optichallenge.hf.space").
name: Keep alive

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: curl -fsS --retry 5 --retry-delay 30 --max-time 120 "${APP_URL}/api/health"
