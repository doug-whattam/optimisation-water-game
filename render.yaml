services:
  # Backend API (Python FastAPI)
  - type: web
    name: opticlean-water-game-api
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./opticlean.db
      - key: CORS_ORIGINS
        value: https://opticlean-water-game.onrender.com,https://optimisation-water-game.onrender.com
    disk:
      name: opticlean-data
      mountPath: /opt/render/project/src
      sizeGB: 1

  # Frontend (Static Site)
  - type: web
    name: opticlean-water-game
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://opticlean-water-game-api.onrender.com/api/*
      - type: rewrite
        source: /ws/*
        destination: https://opticlean-water-game-api.onrender.com/ws/*
      - type: rewrite
        source: /*
        destination: /index.html
