<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a1020" />
    <meta
      name="description"
      content="OptiClean — design a clean water distribution network, simulate it in EPANET, and compete on the cost vs performance Pareto front."
    />
    <title>OptiClean · Water Network Optimisation</title>
    <style>
      /* Inline splash so there is no white flash while the 3D bundle loads */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #17223c 0%, #0a1020 55%, #070b14 100%);
        font: 500 13px/1.4 Inter, system-ui, sans-serif;
        color: #64748b;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .drop {
        width: 46px;
        height: 46px;
        border-radius: 50% 50% 50% 4px;
        transform: rotate(-45deg);
        background: linear-gradient(140deg, #7dd3fc, #0284c7);
        box-shadow: 0 0 40px -6px rgba(56, 189, 248, 0.7);
        animation: bob 1.5s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: rotate(-45deg) translateY(0);
        }
        50% {
          transform: rotate(-45deg) translateY(-9px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .drop {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="drop"></div><span>Loading network</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
